# 勤加软件WEB服务器运维管理平台 - 服务端配置
server:
  port: 8080
  mode: release  # debug / release
  # guacamole-server（guacd）地址，用于 H5 远程桌面（Windows RDP）。
  # 部署示例（Docker）：docker run --name guacd -d -p 4822:4822 guacamole/guacd
  # 默认 127.0.0.1:4822；置为 "-" 禁用 H5 远程桌面
  guacd_addr: "127.0.0.1:4822"

database:
  driver: sqlite
  dsn: ./data/gateway.db

jwt:
  secret: "qinjia-gateway-secret-2026"
  expire: 7200          # token 过期时间（秒）2小时
  refresh_expire: 604800 # 刷新token过期时间（秒）7天

# 默认管理员账号（admin / admin123）已内置在程序中，首次启动自动创建并写入数据库，
# 不在配置文件中保存明文账号密码；安装版由安装程序直接写入数据库。
# 如需修改密码，请登录平台后在「用户管理」中操作。
